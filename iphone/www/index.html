<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afișare Druțu</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:#e6e9f5;font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(500px 380px at 0% -5%,rgba(99,102,241,.4),transparent 65%),radial-gradient(420px 360px at 100% 10%,rgba(139,92,246,.3),transparent 60%),#070b1e;padding:calc(40px + env(safe-area-inset-top)) 22px 30px;display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:30px;font-weight:800;color:#fff;letter-spacing:-.02em}
  p{margin:0;color:#9aa6c4;font-size:15px}
  input{width:100%;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(2,6,23,.5);color:#fff;font-size:17px}
  button{min-height:54px;border-radius:16px;border:0;background:linear-gradient(180deg,#6366f1,#4f46e5);color:#fff;font-size:17px;font-weight:700}
  .err{color:#fca5a5;min-height:22px;font-size:14px}
  .card{padding:14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:14px;color:#cbd2e6}
  b{color:#fff}
</style>
</head>
<body>
  <h1>Afișare Druțu</h1>
  <p>Leagă aplicația de PC-ul panoului. Adresa o găsești în aplicația de pe PC → Setări → „Conectează telefonul”.</p>
  <form id="f" style="display:flex;flex-direction:column;gap:12px">
    <input id="addr" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="ex. http://192.168.1.50:8080">
    <div class="err" id="err"></div>
    <button>Conectează</button>
  </form>
  <div class="card">De acasă (alt internet): folosește adresa <b>Tailscale</b> a PC-ului, ex. <b>https://minix.tail1234.ts.net</b>. Pașii sunt în ghid.</div>
<script>
const KEY = 'panou.server';
const norm = v => { v = v.trim().replace(/\/+$/, ''); if (!/^https?:\/\//i.test(v)) v = 'http://' + v; if (!/:\d+$/.test(v) && v.startsWith('http://')) v += ':8080'; return v; };
async function go(addr, quiet) {
  const err = document.getElementById('err');
  err.textContent = quiet ? '' : 'Se verifică…';
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(addr + '/api/ping', { signal: ctl.signal });
    if (!r.ok) throw new Error();
    localStorage.setItem(KEY, addr);
    location.href = addr + '/app.html?app=ios';
  } catch { err.textContent = 'Nu găsesc panoul la adresa asta. Verifică adresa și că PC-ul e pornit (și Tailscale, dacă ești de acasă).'; }
}
const saved = localStorage.getItem(KEY);
document.getElementById('addr').value = saved || '';
if (saved && !/[?&]schimba=1/.test(location.search)) go(saved, true);
document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = document.getElementById('addr').value; if (v) go(norm(v)); };
</script>
</body>
</html>
