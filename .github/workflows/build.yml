name: Build

# Construiește aplicația pentru Windows și Mac.
# - la fiecare push: fișierele apar la Actions → rularea → Artifacts
# - la fiecare push pe main: se creează/actualizează Release-ul v<versiune din package.json>
#   (pentru o versiune nouă schimbi doar "version" în package.json)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --publish never
          - os: macos-14
            cmd: npx electron-builder --mac --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Afisare-Drutu-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Versiune
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: Afișare Druțu ${{ steps.ver.outputs.v }}
          body: |
            **Windows:** `.exe` = instalator, `.zip` = fără instalare.
            **Mac:** `arm64` = M1–M4, `x64` = Intel. La prima deschidere: Setări sistem → Confidențialitate și securitate → Deschide oricum.
            **iPhone:** vezi GHID-IPHONE.md.
            **Acces de oriunde:** instalează și Tailscale (gratuit) pe PC-ul panoului — din aplicație: Setări → Acces de oriunde → Instalează Tailscale, sau de pe https://tailscale.com/download
            Aplicația instalată se actualizează singură (Windows). Datele (playlist, fișiere, setări) se păstrează.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
